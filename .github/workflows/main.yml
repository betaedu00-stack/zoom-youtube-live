name: Zoom to YouTube Live

on:
  repository_dispatch:
    types:
      - start_stream

  workflow_dispatch:
    inputs:
      zoom_url:
        description: "Zoom meeting/webinar URL"
        required: true
        type: string

      name:
        description: "Name"
        required: false
        type: string

      email:
        description: "Email"
        required: false
        type: string

      chat_id:
        description: "Telegram Chat ID"
        required: false
        type: string


jobs:

  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DISPLAY: :99

      ZOOM_URL: ${{ github.event.client_payload.zoom_url || inputs.zoom_url }}
      NAME: ${{ github.event.client_payload.name || inputs.name }}
      EMAIL: ${{ github.event.client_payload.email || inputs.email }}
      CHAT_ID: ${{ github.event.client_payload.chat_id || inputs.chat_id }}

      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_REPO: ${{ secrets.GH_REPO }}

      YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Code
        uses: actions/checkout@v4


      # ======================================================
      # NODE.JS
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ======================================================
      # INSTALL TOOLS
      # ======================================================

      - name: Install Tools
        shell: bash
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            gnupg \
            xvfb \
            ffmpeg \
            pulseaudio \
            fluxbox \
            x11-utils \
            ca-certificates


          # --------------------------------------------------
          # Google Chrome GPG key
          # --------------------------------------------------

          wget -q \
            https://dl.google.com/linux/linux_signing_key.pub \
            -O /tmp/google-chrome-key.pub


          sudo gpg \
            --batch \
            --yes \
            --no-tty \
            --dearmor \
            -o /usr/share/keyrings/google-chrome.gpg \
            /tmp/google-chrome-key.pub


          # --------------------------------------------------
          # Google Chrome repository
          # --------------------------------------------------

          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list


          # --------------------------------------------------
          # Install Chrome
          # --------------------------------------------------

          sudo apt-get update

          sudo apt-get install -y google-chrome-stable


          # --------------------------------------------------
          # Check installations
          # --------------------------------------------------

          google-chrome --version

          node --version

          npm --version

          ffmpeg -version | head -n 1


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Dependencies
        shell: bash
        run: |

          npm install


      # ======================================================
      # START DISPLAY AND AUDIO
      # ======================================================

      - name: Start Display and Audio
        shell: bash
        run: |

          # --------------------------------------------------
          # Virtual Display
          # --------------------------------------------------

          Xvfb :99 \
            -screen 0 1920x1080x24 \
            -ac \
            +extension RANDR \
            > /tmp/xvfb.log 2>&1 &


          sleep 3


          # --------------------------------------------------
          # Window Manager
          # --------------------------------------------------

          fluxbox \
            > /tmp/fluxbox.log 2>&1 &


          # --------------------------------------------------
          # PulseAudio
          # --------------------------------------------------

          pulseaudio \
            --start \
            --exit-idle-time=-1 \
            --system=false \
            > /tmp/pulseaudio.log 2>&1 || true


          sleep 3


          # --------------------------------------------------
          # Virtual Audio Sink
          # --------------------------------------------------

          pactl load-module module-null-sink \
            sink_name=vss \
            sink_properties=device.description=VirtualSink || true


          # --------------------------------------------------
          # Set Virtual Sink as default
          # --------------------------------------------------

          pactl set-default-sink vss || true


          # --------------------------------------------------
          # Check display/audio
          # --------------------------------------------------

          echo "DISPLAY=$DISPLAY"

          pactl info || true

          pactl list short sinks || true


      # ======================================================
      # START ZOOM AUTOMATION
      # ======================================================

      - name: Start Zoom Automation
        shell: bash
        run: |

          echo "Starting Zoom automation..."

          echo "Zoom URL:"
          echo "$ZOOM_URL"

          echo "Name:"
          echo "$NAME"

          echo "Email:"
          echo "$EMAIL"

          echo "Chat ID:"
          echo "$CHAT_ID"


          # --------------------------------------------------
          # Start Zoom automation
          # --------------------------------------------------

          node zoom.js \
            > zoom.log 2>&1 &


          ZOOM_PID=$!

          echo "Zoom PID: $ZOOM_PID"

          echo "$ZOOM_PID" > zoom.pid


          # --------------------------------------------------
          # Give Chrome/Zoom time to start
          # --------------------------------------------------

          sleep 30


          # --------------------------------------------------
          # Check process
          # --------------------------------------------------

          if kill -0 "$ZOOM_PID" 2>/dev/null; then

            echo "Zoom automation is running."

          else

            echo "Zoom automation stopped."

            echo "========== zoom.log =========="

            cat zoom.log || true

            exit 1

          fi


      # ======================================================
      # START YOUTUBE STREAM
      # ======================================================

      - name: Start YouTube Stream
        shell: bash
        run: |

          echo "Starting YouTube Live stream..."

          if [ -z "$YOUTUBE_STREAM_KEY" ]; then

            echo "ERROR: YOUTUBE_STREAM_KEY is missing."

            exit 1

          fi


          # --------------------------------------------------
          # Wait a little more for Zoom
          # --------------------------------------------------

          sleep 10


          # --------------------------------------------------
          # FFmpeg
          # --------------------------------------------------

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -f x11grab \
            -draw_mouse 0 \
            -video_size 1920x1080 \
            -framerate 30 \
            -i :99.0 \
            -f pulse \
            -i vss.monitor \
            -c:v libx264 \
            -preset veryfast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -r 30 \
            -g 60 \
            -b:v 4500k \
            -maxrate 4500k \
            -bufsize 9000k \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"


      # ======================================================
      # UPLOAD LOGS
      # ======================================================

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoom-youtube-logs
          path: |
            zoom.log
            /tmp/xvfb.log
            /tmp/fluxbox.log
            /tmp/pulseaudio.log
            /tmp/zoom_current.png
          if-no-files-found: ignore


      # ======================================================
      # POST SETUP
      # ======================================================

      - name: Post Setup Node.js
        if: always()
        run: |

          echo "Node.js version:"
          node --version


      # ======================================================
      # COMPLETE
      # ======================================================

      - name: Complete
        if: always()
        run: |

          echo "=========================================="
          echo "Zoom → YouTube Live workflow finished."
          echo "=========================================="
