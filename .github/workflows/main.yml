name: Zoom to YouTube Stream

on:
  repository_dispatch:
    types: [start_stream] # බොට් එකෙන් එවන signal එක
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Zoom URL
        run: |
          # බොට් එකෙන් එවපු ලින්ක් එක හෝ secret එකෙන් ලින්ක් එක තෝරා ගැනීම
          if [ "${{ github.event.client_payload.zoom_url }}" != "" ]; then
            echo "ZOOM_URL=${{ github.event.client_payload.zoom_url }}" >> $GITHUB_ENV
          else
            echo "ZOOM_URL=${{ secrets.ZOOM_URL }}" >> $GITHUB_ENV
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb ffmpeg pulseaudio fluxbox

      - name: Install Dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install puppeteer-extra puppeteer-extra-plugin-stealth puppeteer

      - name: Start Stream
        env:
          ZOOM_URL: ${{ env.ZOOM_URL }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:99
          for i in {1..10}; do xset -q -display :99 >/dev/null 2>&1 && break || sleep 1; done
          fluxbox &
          sleep 5
          pulseaudio -D --exit-idle-time=-1
          pacmd load-module module-virtual-sink sink_name=vss
          pacmd set-default-sink vss

          node zoom.js &
          sleep 60

          ffmpeg -f x11grab -draw_mouse 0 -video_size 1920x1080 -i :99 \
          -f pulse -i default \
          -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k \
          -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"
