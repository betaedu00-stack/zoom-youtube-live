name: Zoom to YouTube Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg pulseaudio fluxbox libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm-dev

      - name: Install NPM Dependencies
        run: npm install puppeteer-extra puppeteer-extra-plugin-stealth puppeteer

      - name: Start Virtual Display & Stream
        env:
          ZOOM_URL: ${{ secrets.ZOOM_URL }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # 1. Virtual Screen (Display) ආරම්භ කිරීම
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          export DISPLAY=:99
          
          # 2. Window Manager එක ආරම්භ කිරීම (කළු තිරය වැළැක්වීමට)
          fluxbox &
          sleep 5

          # 3. Audio Setup
          pulseaudio -D --exit-idle-time=-1
          pacmd load-module module-virtual-sink sink_name=vss
          pacmd set-default-sink vss

          # 4. Zoom Automation එක Background එකේ පණගැන්වීම
          node zoom.js &
          sleep 30 # මීටින් එකට ලොග් වීමට කාලය ලබා දීම

          # 5. FFmpeg හරහා YouTube වෙත Stream කිරීම
          ffmpeg -f x11grab -video_size 1920x1080 -i :99 \
          -f pulse -i default \
          -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k \
          -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"
