name: Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process $installer -ArgumentList "/quiet" -Wait

      - name: Connect to Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="$env:TS_AUTHKEY"

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

      - name: Create RDP User
        shell: powershell
        run: |
          $password = ConvertTo-SecureString "ZoomRDP@2026!Live" -AsPlainText -Force

          if (-not (Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue)) {
            New-LocalUser `
              -Name "rdpuser" `
              -Password $password `
              -FullName "RDP User" `
              -Description "Temporary RDP user"
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "rdpuser"

      - name: Show Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host " RDP USER     : rdpuser"
          Write-Host " RDP PASSWORD : ZoomRDP@2026!Live"
          Write-Host "========================================="
          Write-Host ""

          & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "Keep this workflow running while using RDP."
          Write-Host "========================================="

      - name: Keep RDP Alive
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
